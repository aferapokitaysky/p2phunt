name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: p2phunt
          POSTGRES_PASSWORD: p2phunt
          POSTGRES_DB: p2phunt
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U p2phunt -d p2phunt"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://p2phunt:p2phunt@localhost:5432/p2phunt?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-access-secret
      JWT_REFRESH_SECRET: ci-refresh-secret
      ENCRYPTION_KEY: ci-32-byte-minimum-encryption-key

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm -r lint

      - name: Build shared packages
        run: pnpm build:packages

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Prisma generate + migrate
        run: |
          pnpm --filter @p2phunt/api exec prisma generate
          pnpm --filter @p2phunt/api exec prisma migrate deploy

      - name: Test
        run: pnpm -r test

      - name: Build
        run: pnpm -r build
